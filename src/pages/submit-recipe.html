---
{"title":"Submit a Recipe to AllVeg","description":"Get your vegetarian or vegan recipe published on AllVeg.com with full credit and a link back.","priority":"0.5"}
---
<section><div class="wrap"><span class="eyebrow">Submit</span><h1>Submit your recipe</h1><p class="lead">Published recipes get your name, a link to your site or profile and a share to our channels.</p>
<div class="form-card" style="max-width:760px"><form class="form" data-form="Recipe submission"><div class="honey"><input name="_gotcha"></div>
<div class="form-row"><div><label>Your name</label><input type="text" name="name" required></div><div><label>Email</label><input type="email" name="email" required></div></div>
<div><label>Recipe title</label><input type="text" name="title" required></div>
<div class="form-row"><div><label>Servings</label><input type="number" name="servings"></div><div><label>Total time (min)</label><input type="number" name="time"></div></div>
<div><label>Ingredients (one per line with quantities)</label><textarea name="ingredients" required></textarea></div>
<div><label>Method (numbered steps)</label><textarea name="method" required></textarea></div>
<div><label>Link to a photo or your site</label><input type="url" name="link"></div>
<label class="check"><input type="checkbox" name="original" value="yes" required> This recipe is my original work and I license AllVeg to publish it with credit.</label>
<button class="btn btn-primary btn-lg" type="submit">Submit recipe</button><div class="alert"></div></form></div></div></section>
